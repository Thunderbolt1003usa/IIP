# /etc/iip/iip.conf
# Einstellungen fuer den iip-Daemon (Internet Informations Protokoll)
# Der Server lauscht auf demselben Port per TCP und per UDP.

listen_addr = 0.0.0.0
listen_port = 65535

# Pfad zur Datendatei, die als Antwort auf "GET" 1:1 zurueckgesendet wird
data_file = /etc/iip/iip.json

# Rate-Limiting pro Quell-IP (Anfragen/Sekunde, Burst-Kapazitaet).
# Gilt fuer TCP-Verbindungen und UDP-Pakete zusammen.
rate_limit = 5
rate_limit_burst = 10

# Maximal gleichzeitig offene TCP-Verbindungen. Weitere werden sofort geschlossen.
max_connections = 100

# Sicherheitslimit: iip.json darf nicht groesser sein als dies (Bytes)
max_response_size = 8192
